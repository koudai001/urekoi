openapi: 3.0.3
info:
  title: urekoi API
  description: 熟女専門マッチングアプリ urekoi のAPI仕様
  version: 0.1.0
  license:
    name: UNLICENSED
    url: https://github.com/koudai001/urekoi
servers:
  - url: https://github.com/koudai001/urekoi
    description: 本番環境のAPIサーバー。実際のURLは環境変数で切り替える想定。

tags:
  - name: auth
    x-displayName: 認証
    description: サインアップ・ログイン・トークン管理
  - name: myprofile
    x-displayName: 自分のプロフィール
    description: 自分のプロフィール情報・画像の取得と編集
  - name: partner
    x-displayName: 相手プロフィール（スワイプ候補）
    description: スワイプ候補の一覧・詳細の取得
  - name: likes
    x-displayName: いいね
    description: いいねの送信・受信一覧の取得
  - name: skips
    x-displayName: スキップ
    description: スキップの送信
  - name: matches
    x-displayName: マッチング
    description: マッチ済みの相手一覧・詳細の取得
  - name: messages
    x-displayName: メッセージ
    description: マッチ相手とのメッセージ送受信
  - name: websocket
    x-displayName: リアルタイム通信
    description: WebSocketによるメッセージのリアルタイム配信

paths:
  /signup:
    post:
      tags: [auth]
      operationId: postSignup
      summary: メールアドレス・パスワード登録
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          description: バリデーションエラー(email形式・password 8文字未満など)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: メールアドレスの形式が正しくありません
        "409":
          description: email重複
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: このメールアドレスは既に登録されています

  /login:
    post:
      tags: [auth]
      operationId: postLogin
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: パスワードを入力してください
        "401":
          description: email未登録 or パスワード不一致(列挙攻撃防止のため区別せず統一)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid email or password

  /google-login:
    post:
      tags: [auth]
      operationId: postGoogleLogin
      summary: Googleログイン(初回は自動でユーザー作成、2回目以降はログイン)
      description: クライアント側(Google Identity Services)が発行したid_tokenをそのまま渡す。APIが署名を検証し、ユーザー作成またはログインを行う
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: 認証成功(新規作成・既存ログインいずれも200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          description: id_tokenが不正、または検証に失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Googleとの認証に失敗しました

  /refresh:
    post:
      tags: [auth]
      operationId: postRefresh
      summary: アクセストークンの再発行
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 再発行成功(refresh_tokenもローテーションされる)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: リフレッシュトークンを入力してください
        "401":
          description: refresh_tokenが無効・期限切れ・失効済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid or expired refresh token

  /logout:
    post:
      tags: [auth]
      operationId: postLogout
      summary: ログアウト(refresh_tokenを失効させる)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: ログアウト成功
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: リフレッシュトークンを入力してください
        "401":
          description: refresh_tokenが無効・期限切れ・失効済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid or expired refresh token

  /me:
    delete:
      tags: [auth]
      operationId: deleteUsersMe
      summary: 退会
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 退会成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  /myprofile:
    get:
      tags: [myprofile]
      operationId: getMyprofile
      summary: 自分のプロフィール取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: プロフィール未作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: profile not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [myprofile]
      operationId: postMyprofile
      summary: 初回プロフィール作成
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyProfileCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: プロフィール作成済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [myprofile]
      operationId: putMyprofile
      summary: プロフィール更新
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyProfileRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: プロフィール未作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: profile not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /myprofile/images/presign:
    post:
      tags: [myprofile]
      operationId: postMyprofileImagesPresign
      summary: プロフィール画像アップロード用の署名付きURLを発行
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImagePresignRequest"
      responses:
        "200":
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImagePresignResponse"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /myprofile/images:
    post:
      tags: [myprofile]
      operationId: postMyprofileImages
      summary: presignでアップロード済みのkeyからプロフィール画像を登録
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImageCreateRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageResponse"
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /myprofile/images/{image_id}:
    delete:
      tags: [myprofile]
      operationId: deleteMyprofileImage
      summary: プロフィール画像を削除
      security:
        - bearerAuth: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 削除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 画像が見つからない、または自分の画像でない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: image not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /myprofile/images/order:
    put:
      tags: [myprofile]
      operationId: putMyprofileImagesOrder
      summary: プロフィール画像の並び替え
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImageOrderRequest"
      responses:
        "204":
          description: 並び替え成功
        "400":
          description: バリデーションエラー(自分の画像でないIDを含む場合も含む)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tags:
    get:
      tags: [profile]
      operationId: getTags
      summary: 選択可能なタグ一覧取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /partner/search:
    get:
      tags: [partner]
      operationId: searchPartners
      summary: 相手検索
      description: 認証済みユーザー自身・いいね済み・スキップ済み・マッチ済みの相手を除外し、カーソル方式で取得する
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          description: 未指定時は通常順、newest指定時は新着順
          schema:
            type: string
            enum: [newest]
        - name: cursor
          in: query
          required: false
          description: 前ページのnext_cursor。最初のページでは指定しない
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          description: 1ページに取得する件数
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSearchResponse"
        "400":
          description: クエリパラメータが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /partner/{userId}:
    get:
      tags: [partner]
      operationId: getPartnerByUserId
      summary: 相手詳細取得
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: 相手のUser.ID(Profile.IDではない)
          schema:
            type: integer
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: プロフィールが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: profile not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /likes:
    post:
      tags: [likes]
      operationId: postLikes
      summary: いいねを送る
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeRequest"
      responses:
        "201":
          description: いいね成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "400":
          description: バリデーションエラー(自分自身へのいいねなど)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 相手が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: user not found
        "409":
          description: 既にいいね済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: already liked
        "500":
          $ref: "#/components/responses/InternalServerError"

  /likes/pending:
    get:
      tags: [likes]
      operationId: getLikesPending
      summary: マッチ済み・スキップ済みを除いた、もらったいいね一覧を取得(ポーリングでの利用を想定)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingLikesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /likes/sent:
    get:
      tags: [likes]
      operationId: getLikesSent
      summary: 自分が送ったいいね一覧を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /skips:
    post:
      tags: [skips]
      operationId: postSkips
      summary: 相手をスキップする
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipRequest"
      responses:
        "201":
          description: スキップ成功
        "400":
          description: バリデーションエラー(自分自身へのスキップなど)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 相手が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: user not found
        "409":
          description: 既にスキップ済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: already skipped
        "500":
          $ref: "#/components/responses/InternalServerError"

  /matches/unmessaged:
    get:
      tags: [matches]
      operationId: getUnmessagedMatches
      summary: メッセージ未送信のマッチ一覧取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /matches/messaged:
    get:
      tags: [matches]
      operationId: getMessagedMatches
      summary: メッセージ送信済みのマッチ一覧を取得（最新メッセージの新しい順・最新メッセージ付き）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchProfileWithLastMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /matches/{match_id}:
    get:
      tags: [matches]
      operationId: getMatch
      summary: マッチ1件の詳細取得(相手のプロフィール詳細を含む)
      security:
        - bearerAuth: []
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchProfileDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: マッチが見つからない、または自分が当事者でない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: match not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /matches/{match_id}/messages:
    parameters:
      - name: match_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [messages]
      operationId: getMatchesMatchIdMessages
      summary: マッチ相手とのメッセージ履歴を取得(新しい順、before_idカーソルでページネーション)
      security:
        - bearerAuth: []
      parameters:
        - name: before_id
          in: query
          description: このID未満(より古い)のメッセージを取得する
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: 取得件数(未指定時は50)
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageResponse"
        "400":
          description: match_id/before_id/limitの形式が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このマッチの当事者ではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not a participant of this match
        "404":
          description: マッチが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: match not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [messages]
      operationId: postMatchesMatchIdMessages
      summary: マッチ相手にメッセージを送る
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "201":
          description: 送信成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: バリデーションエラー(本文が空・200文字超など)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: このマッチの当事者ではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not a participant of this match
        "404":
          description: マッチが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: match not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /ws/ticket:
    post:
      tags: [websocket]
      operationId: postWsTicket
      summary: WebSocket接続用の使い捨てチケットを発行する(TTL30秒、1回だけ使用可能)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WsTicketResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /ws:
    get:
      tags: [websocket]
      operationId: getWs
      summary: |
        WebSocket接続のハンドシェイク(アップグレード)エンドポイント。
        接続成立後のメッセージのやり取りはAsyncAPI(docs/asyncapi.yaml)を参照。
        POST /ws/ticketで発行したticketをクエリパラメータで渡す(例: wss://.../ws?ticket=xxxx)。
      security:
        - wsTicket: []
      responses:
        "101":
          description: WebSocketへアップグレード成功
        "200":
          description: WebSocket接続成功（Linter用に明示的に記載）
        "400":
          description: ticket未指定、または既に失効・使用済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    wsTicket:
      type: apiKey
      in: query
      name: ticket
      description: POST /ws/ticketで発行した使い捨てチケット
  responses:
    Unauthorized:
      description: 未認証
    InternalServerError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          minLength: 8
          example: password123
    SignupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: test@example.com
        access_token:
          type: string
          example: <JWT>
        refresh_token:
          type: string
          example: <refresh token>
        has_profile:
          type: boolean
          description: プロフィール作成済みかどうか。falseならプロフィール作成画面へ誘導する
          example: false
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Google Identity Servicesが発行したid_token(JWT)。クライアント側でそのまま渡す
          example: <id_token(JWT)>
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          example: password123
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: <JWT>
        refresh_token:
          type: string
          example: <refresh token>
        has_profile:
          type: boolean
          description: プロフィール作成済みかどうか。falseならプロフィール作成画面へ誘導する
          example: true
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: <refresh token>
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          example: <JWT>
        refresh_token:
          type: string
          example: <new refresh token>
        has_profile:
          type: boolean
          description: プロフィール作成済みかどうか。falseならプロフィール作成画面へ誘導する
          example: true
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: <refresh token>
    PartnerSearchResponse:
      type: object
      required: [profiles, next_cursor]
      properties:
        profiles:
          type: array
          description: 検索条件に一致する相手プロフィール。候補がない場合は空配列
          items:
            $ref: "#/components/schemas/ProfileDetail"
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: 次ページ取得に使うカーソル。最終ページではnull
          example: 20
    ProfileDetail:
      type: object
      required:
        - user_id
        - nickname
        - age
        - prefecture_code
        - prefecture
        - bio
        - occupation
        - hometown
        - blood_type
        - mbti
        - body_type
        - education
        - holiday
        - alcohol
        - smoking
        - height_cm
        - tag_ids
        - tags
        - images
        - already_liked
      properties:
        user_id:
          type: integer
          format: int64
          example: 1
        nickname:
          type: string
          example: たろう
        age:
          type: integer
          example: 42
        prefecture_code:
          type: integer
          example: 13
        prefecture:
          type: string
          example: 東京都
        bio:
          type: string
          example: よろしくお願いします
        occupation:
          type: string
          example: エンジニア
        hometown:
          type: string
          example: 東京
        blood_type:
          type: string
          example: A型
        mbti:
          type: string
          example: INTJ
        body_type:
          type: string
          example: 普通
        education:
          type: string
          example: 大学卒
        holiday:
          type: string
          example: 土日
        alcohol:
          type: string
          example: 時々飲む
        smoking:
          type: string
          example: 吸わない
        height_cm:
          type: integer
          example: 175
        tag_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagSummary"
        images:
          type: array
          description: sort_order順に並んだ登録済みのプロフィール画像
          items:
            $ref: "#/components/schemas/ProfileImageResponse"
        already_liked:
          type: boolean
          description: 相手プロフィール表示時のみ使用。閲覧者が既にこの相手にいいね済みか
          example: false
    TagSummary:
      type: object
      properties:
        label:
          type: string
          example: 甘いもの大好き
        category:
          type: string
          example: グルメ・お酒
        image_url:
          type: string
          example: /tags/sweets.png
    TagOption:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        label:
          type: string
          example: 甘いもの大好き
        category:
          type: string
          example: グルメ・お酒
    LikeRequest:
      type: object
      required: [to_user_id]
      properties:
        to_user_id:
          type: integer
          format: int64
          example: 1
    LikeResponse:
      type: object
      required: [matched]
      properties:
        matched:
          type: boolean
          description: 相互いいねによりマッチが成立したか
          example: false
        match_id:
          type: integer
          format: int64
          description: 成立したマッチのID。matchedがtrueの場合のみ返す
          example: 1
    PendingLikesResponse:
      type: object
      required:
        - total
        - profiles
      properties:
        total:
          type: integer
          example: 1
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileDetail"
    SkipRequest:
      type: object
      required: [to_user_id]
      properties:
        to_user_id:
          type: integer
          format: int64
          example: 1
    MatchProfile:
      type: object
      properties:
        match_id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        nickname:
          type: string
          example: たろう
        age:
          type: integer
          example: 42
        prefecture:
          type: string
          example: 東京都
        image:
          type: string
          example: /placeholder.svg
    MatchProfileWithLastMessage:
      description: GET /matches/messagedのレスポンス(最新メッセージ情報を含む)
      allOf:
        - $ref: "#/components/schemas/MatchProfile"
        - type: object
          required: [last_message, last_message_at, last_message_sender_user_id]
          properties:
            last_message:
              type: string
              example: よろしくお願いします
            last_message_at:
              type: string
              format: date-time
            last_message_sender_user_id:
              type: integer
              format: int64
              example: 1
    MatchProfileDetail:
      allOf:
        - type: object
          properties:
            match_id:
              type: integer
              format: int64
              example: 1
            matched_at:
              type: string
              format: date-time
              example: "2026-04-06T12:00:00+09:00"
        - $ref: "#/components/schemas/ProfileDetail"
    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 200
          example: よろしくお願いします!
    MessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        sender_user_id:
          type: integer
          format: int64
          example: 1
        body:
          type: string
          example: よろしくお願いします!
        created_at:
          type: string
          format: date-time
    WsTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          example: 3f1e2b7c9a8d4e6f1a2b3c4d5e6f7a8b
    MyProfileRequest:
      type: object
      required: [nickname, prefecture_code]
      properties:
        nickname:
          type: string
          example: たろう
        prefecture_code:
          type: integer
          example: 13
        bio:
          type: string
          example: よろしくお願いします
        occupation:
          type: string
          example: エンジニア
        hometown:
          type: string
          example: 東京
        blood_type:
          type: string
          example: A型
        mbti:
          type: string
          example: INTJ
        body_type:
          type: string
          example: 普通
        education:
          type: string
          example: 大学卒
        holiday:
          type: string
          example: 土日
        alcohol:
          type: string
          example: 時々飲む
        smoking:
          type: string
          example: 吸わない
        height_cm:
          type: integer
          example: 175
        tag_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
    MyProfileCreateRequest:
      type: object
      required: [nickname, prefecture_code, gender, birthdate]
      properties:
        nickname:
          type: string
          example: たろう
        prefecture_code:
          type: integer
          example: 13
        gender:
          type: string
          enum: [male, female]
          example: female
        birthdate:
          type: string
          format: date
          example: "1990-01-01"
    ProfileImagePresignRequest:
      type: object
      required: [content_type, extension]
      properties:
        content_type:
          type: string
          example: image/jpeg
        extension:
          type: string
          description: S3のkeyに使う拡張子(先頭のドット無し)
          example: jpg
    ProfileImagePresignResponse:
      type: object
      properties:
        upload_url:
          type: string
          description: このURLに画像本体をPUTでアップロードする(署名付き、短時間で失効)
          example: https://urekoi-profile-images.s3.ap-northeast-1.amazonaws.com/profiles/1/xxxx.jpg?X-Amz-...
        image_key:
          type: string
          description: アップロード完了後、POST /myprofile/imagesに渡すkey
          example: profiles/1/xxxx.jpg
    ProfileImageCreateRequest:
      type: object
      required: [image_key]
      properties:
        image_key:
          type: string
          description: POST /myprofile/images/presignで発行されたimage_key
          example: profiles/1/xxxx.jpg
    ProfileImageOrderRequest:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          description: 並び替え後の全画像IDを新しい順序で並べた配列
          items:
            type: integer
            format: int64
          example: [3, 1, 2]
    ProfileImageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        url:
          type: string
          example: https://images.urekoi.example.com/profiles/1/xxxx.jpg
        sort_order:
          type: integer
          example: 0
    Error:
      type: object
      properties:
        error:
          type: string
