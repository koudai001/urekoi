services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: urekoi
      POSTGRES_PASSWORD: urekoi
      POSTGRES_DB: urekoi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # S3互換ストレージ(ローカル開発用。本番はAWS S3を使う)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # サーバーを起動 /dataにデータを保存し、管理コンソールは9001番ポートでアクセス可能にする
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3互換API
      - "9001:9001" # 管理コンソール
    volumes:
      - minio_data:/data

  # MinIO起動後に一度だけ実行し、バケット作成+公開読み取り設定を行う(本番のCloudFront/検証環境のR2公開設定と同じ状態を再現)
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 1; done;
      mc mb -p local/urekoi-profile-images;
      mc anonymous set download local/urekoi-profile-images;
      "

  api:
    # 本番用Dockerfileの動作確認用。`docker compose up -d`(引数無し)では起動しない
    # 確認したい時だけ `docker compose up -d api` のように明示的に指定する
    profiles: ["build-check"]
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - apps/api/.env.local
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - minio

volumes:
  db_data:
  redis_data:
  minio_data:
